[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browser-use-sdk"
version = "3.12.1"
description = "Official Python SDK for Browser Use Cloud: hosted cloud browsers for AI agents (CDP) and a browser agent API, from $0.02/browser-hour"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24.1,<1",
    "pydantic>=2.10.6,<3",
    # Security floors on transitive dependencies of httpx.
    "idna>=3.19",  # CVE-2026-45409
    "certifi>=2026.10.19",  # GHSA-6q48-6c7w-9gw2
]

[project.urls]
Homepage = "https://github.com/browser-use/sdk"
Repository = "https://github.com/browser-use/sdk"
Issues = "https://github.com/browser-use/sdk/issues"

[project.optional-dependencies]
dev = [
    # pytest 9.0.3 is the first safe release and requires Python 3.10+.
    "pytest==9.1.1; python_version >= '3.10'",  # CVE-2025-71176
    "pyright==1.1.411",
]
examples = [
    # python-dotenv 1.2.2 is the first safe release and requires Python 3.10+.
    "python-dotenv==1.2.2; python_version >= '3.10'",  # CVE-2026-28684
]
# Pay for API access with USDC instead of an API key. Requires Python 3.10+.
# Install with: pip install "browser-use-sdk[x402]"
x402 = [
    "x402[evm]==2.17.0; python_version >= '3.10'",
    # Security pin on a transitive dep (x402[evm] -> web3 -> requests -> urllib3).
    # Published in the extra so it reaches consumers, not just this repo's lockfile.
    "urllib3==2.8.0; python_version >= '3.10'",  # CVE-2026-44431, CVE-2026-44432, CVE-2026-97687, CVE-2026-97688, CVE-2026-97689
    # Security pin on a transitive dep (x402[evm] -> web3 -> aiohttp).
    # CVE-2026-34993, CVE-2026-47265, CVE-2026-54273, CVE-2026-54274,
    # CVE-2026-54276, CVE-2026-54277, CVE-2026-54278, CVE-2026-111063,
    # CVE-2026-111064, CVE-2026-111065, CVE-2026-111066, CVE-2026-111748,
    # CVE-2026-111749, CVE-2026-111750, GHSA-2g87-pp6c-29x5
    "aiohttp==3.14.4; python_version >= '3.10'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/browser_use_sdk"]

# Ship only the package source in the sdist; tests, examples and uv.lock stay in the repo.
[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
markers = [
    "prod: production smoke tests (hit real API)",
    "live: live integration tests (hit localhost)",
]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src", "tests", "examples"]

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "pytest==9.1.1; python_version >= '3.10'",  # CVE-2025-71176
]
