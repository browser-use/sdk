<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d" fill="none"><title id="t">One session ID holds runs, one conversation, one workspace and a reusable browser</title><desc id="d">Four runs share one session ID. The conversation grows by one turn per run and the workspace keeps its files. Back-to-back runs reuse the same live browser. After the last run the browser idles for 120 s, then stops. A later run keeps the conversation and files and gets a new browser.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}@keyframes cur{0%,100%{transform:translate(0,0)}35%{transform:translate(-6px,-4px)}70%{transform:translate(-11px,1px)}}@media (prefers-reduced-motion:no-preference){.cur{animation:cur 6s ease-in-out infinite}}@keyframes r1{0%,0.00%{fill-opacity:0;stroke-opacity:0}0.40%,10.64%{fill-opacity:1;stroke-opacity:1}10.94%,100%{fill-opacity:0;stroke-opacity:0}}@media (prefers-reduced-motion:no-preference){.r1{animation:r1 12s linear infinite}}@keyframes r2{0%,13.45%{fill-opacity:0;stroke-opacity:0}13.75%,26.89%{fill-opacity:1;stroke-opacity:1}27.19%,100%{fill-opacity:0;stroke-opacity:0}}@media (prefers-reduced-motion:no-preference){.r2{animation:r2 12s linear infinite}}@keyframes r3{0%,27.51%{fill-opacity:0;stroke-opacity:0}27.81%,38.45%{fill-opacity:1;stroke-opacity:1}38.75%,100%{fill-opacity:0;stroke-opacity:0}}@media (prefers-reduced-motion:no-preference){.r3{animation:r3 12s linear infinite}}@keyframes r5{0%,67.20%{fill-opacity:0;stroke-opacity:0}67.50%,78.76%{fill-opacity:1;stroke-opacity:1}79.06%,100%{fill-opacity:0;stroke-opacity:0}}@media (prefers-reduced-motion:no-preference){.r5{animation:r5 12s linear infinite}}@keyframes w1{0%,9.70%{fill-opacity:0;stroke-opacity:0}10.00%,80.00%{fill-opacity:1;stroke-opacity:1}86.00%,100%{fil