<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 352" width="360" height="352" role="img" aria-labelledby="t d" fill="none"><title id="t">V4 Agent is the most accurate on hard tasks and costs the most per task</title><desc id="d">Three columns, height is accuracy on hard tasks (Internal Bench Hard, Claude Opus 4.8): V2 Agent 54% at $0.70 per task, V3 Agent 67% at $0.87 per task, V4 Agent 76% at $1.64 per task. Cost is the median production task on Claude Opus 4.7. V4 is highlighted in orange.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}@keyframes led{0%,100%{fill-opacity:1}50%{fill-opacity:.15}}@media (prefers-reduced-motion:no-preference){.led{animation:led 2.4s ease-in-out infinite}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#232328"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.07 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="359" height="351" rx="14"/></clipPath><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="360" height="352"><feGaussianBlur stdDeviation="6"/></filter></defs><rect x="0.5" y="0.5" width="359" height="351" rx="14" fill="#111113"/><g clip-path="url(#card)"><rect width="360" height="352" fill="url(#dots)"/><rect width="360" height="352" filter="url(#grain)"/></g><rect x="0.5" y="0.5" width="359" height="351" rx="14" fill="none" stroke="#26262B"/><path d="M11 16h10M16 11v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M339 16h10M344 11v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M11 336h10M16 331v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M339 336h10M3