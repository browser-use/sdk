<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d" fill="none"><title id="t">A run's totalCostUsd covers LLM and search; the session cost adds the browser and proxy</title><desc id="d">The session cost is a stack of four parts: llmCostUsd and searchCostUsd from the run, browserCostUsd and proxyCostUsd from the session's browser. A run's totalCostUsd covers only the lower two. GET /api/v4/sessions/{id}/cost returns all four, including browser time after the run ends.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#DDD8CD"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.05 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="719" height="299" rx="14"/></clipPath><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="300"><feGaussianBlur stdDeviation="4"/></filter></defs><rect x="0.5" y="0.5" width="719" height="299" rx="14" fill="#FBFAF7"/><g clip-path="url(#card)"><rect width="720" height="300" fill="url(#dots)"/><rect width="720" height="300" filter="url(#grain)"/></g><rect x="0.5" y="0.5" width="719" height="299" rx="14" fill="none" stroke="#E6E2D9"/><path d="M15 20h10M20 15v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M695 20h10M700 15v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M15 280h10M20 275v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M695 280h10M700 275v10" stroke="#C9C3B6" stroke-width="0.75"/><text x="34.0" y="24.5" font-size="10" fill="#5F5B53" letter-spacing="0.08em" class="m">FIG 8.1</text><text x="686.0" y="24.5" font-size="10" fill="#5F5B53" text-anchor="end" letter-spacing="0.08em" class="m">BILLING / SESSION COST</text><polyline points="229.6,223.0 292.0,259.0 354.4,223.0" stroke="#C9C3B6" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round" stroke-linecap="round"/><polygon points="354.4,191.0 292.0,227.0 292.0,251.0 354.4,215.0" fill="#F4F1EA" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="229.6,191.0 292.0,227.0 292.0,251.0 229.6,215.0" fill="#F4F1EA" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="292.0,155.0 354.4,191.0 292.0,227.0 229.6,191.0" fill="#FFFFFF" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="354.4,161.0 292.0,197.0 292.0,221.0 354.4,185.0" fill="#F4F1EA" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="229.6,161.0 292.0,197.0 292.0,221.0 229.6,185.0" fill="#F4F1EA" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="292.0,125.0 354.4,161.0 292.0,197.0 229.6,161.0" fill="#FFFFFF" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="354.4,131.0 292.0,167.0 292.0,191.0 354.4,155.0" fill="#F4F1EA" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="229.6,131.0 292.0,167.0 292.0,191.0 229.6,155.0" fill="#F4F1EA" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="292.0,95.0 354.4,131.0 292.0,167.0 229.6,131.0" fill="#FFFFFF" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="354.4,101.0 292.0,137.0 292.0,161.0 354.4,125.0" fill="#F4F1EA" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="229.6,101.0 292.0,137.0 292.0,161.0 229.6,125.0" fill="#F4F1EA" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="292.0,65.0 354.4,101.0 292.0,137.0 229.6,101.0" fill="#FFFFFF" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><text x="368.4" y="207.0" font-size="11" fill="#5F5B53" class="m">llmCostUsd</text><text x="368.4" y="177.0" font-size="11" fill="#5F5B53" class="m">searchCostUsd</text><text x="368.4" y="147.0" font-size="11" fill="#5F5B53" class="m">browserCostUsd</text><text x="368.4" y="117.0" font-size="11" fill="#5F5B53" class="m">proxyCostUsd</text><path d="M220.6 161.0H215.6V215.0H220.6" stroke="#5F5B53" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M220.6 101.0H215.6V155.0H220.6" stroke="#9A958A" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><polygon points="203.4,176.0 175.6,192.0 175.6,216.0 203.4,200.0" fill="#F4F1EA" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="147.9,176.0 175.6,192.0 175.6,216.0 147.9,200.0" fill="#F4F1EA" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="175.6,160.0 203.4,176.0 175.6,192.0 147.9,176.0" fill="#FFFFFF" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><g transform="matrix(0.8660,0.5,-0.8660,0.5,175.6,160.0)"><circle cx="16.0" cy="16.0" r="9.3" stroke="#C9C3B6" stroke-width="0.8" vector-effect="non-scaling-stroke"/><circle cx="16.0" cy="16.0" r="9.3" stroke="#5F5B53" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="36.2 58.3" transform="rotate(-90 16.0 16.0)"/><path d="M13.4 12.6l5.4 3.4l-5.4 3.4z" fill="#5F5B53"/></g><g transform="matrix(0.8660,0.5,0,1,161.7,125.5)"><rect x="0" y="-34" width="46" height="34" rx="2.5" stroke="#9A958A" stroke-width="0.8" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/></g><g transform="matrix