<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Sessions sharing a persistent workspace</title>
  <desc id="desc">Two independent sessions read and write files in one workspace.</desc>
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency=".01" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4"/>
    </filter>
  </defs>
  <rect width="1200" height="480" fill="#09090B"/>
  <rect x="20" y="20" width="1160" height="440" fill="none" stroke="#27272A" stroke-width="2"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)">
    <rect x="60" y="82" width="280" height="120" rx="26" fill="#24140B" stroke="#FE750E" stroke-width="4"/>
    <rect x="60" y="292" width="280" height="120" rx="26" fill="#18181B" stroke="#A1A1AA" stroke-width="4"/>
    <path d="M355 142 C400 147 420 185 465 218" stroke="#A1A1AA" stroke-width="4"/>
    <path d="M443 201 L467 220 L438 221" stroke="#A1A1AA" stroke-width="4"/>
    <path d="M355 352 C400 347 420 309 465 276" stroke="#A1A1AA" stroke-width="4"/>
    <path d="M438 273 L467 274 L443 293" stroke="#A1A1AA" stroke-width="4"/>
    <path d="M480 88 L1135 88 L1135 420 L480 420 Z" fill="#24140B" stroke="#FE750E" stroke-width="4"/>
    <path d="M480 88 L615 88 L642 58 L800 58 L828 88" fill="#24140B" stroke="#FE750E" stroke-width="4"/>
    <rect x="610" y="188" width="395" height="145" rx="26" fill="#18181B" stroke="#A1A1AA" stroke-width="4"/>
  </g>
  <g font-family="Virgil, Comic Sans MS, cursive" text-anchor="middle">
    <text x="200" y="158" font-size="38" fill="#F4F4F5">SESSION A</text>
    <text x="200" y="368" font-size="38" fill="#F4F4F5">SESSION B</text>
    <text x="808" y="145" font-size="40" fill="#F4F4F5">WORKSPACE</text>
    <text x="808" y="279" font-size="48" fill="#F4F4F5">FILES</text>
  </g>
</svg>
