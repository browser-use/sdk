<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" width="360" height="500" role="img" aria-labelledby="t d" fill="none"><title id="t">One session ID holds runs, one conversation, one workspace and a reusable browser</title><desc id="d">Four runs share one session ID. The conversation grows by one turn per run and the workspace keeps its files. Back-to-back runs reuse the same live browser. After the last run the browser idles for 120 s, then stops. A later run keeps the conversation and files and gets a new browser.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}@keyframes r1{0%,1.58%{fill-opacity:0;stroke-opacity:0}1.88%,12.41%{fill-opacity:1;stroke-opacity:1}12.71%,100%{fill-opacity:0;stroke-opacity:0}}@media (prefers-reduced-motion:no-preference){.r1{animation:r1 12s linear infinite}}@keyframes r2{0%,13.82%{fill-opacity:0;stroke-opacity:0}14.12%,24.64%{fill-opacity:1;stroke-opacity:1}24.94%,100%{fill-opacity:0;stroke-opacity:0}}@media (prefers-reduced-motion:no-preference){.r2{animation:r2 12s linear infinite}}@keyframes r3{0%,25.58%{fill-opacity:0;stroke-opacity:0}25.88%,36.41%{fill-opacity:1;stroke-opacity:1}36.71%,100%{fill-opacity:0;stroke-opacity:0}}@media (prefers-reduced-motion:no-preference){.r3{animation:r3 12s linear infinite}}@keyframes r5{0%,62.76%{fill-opacity:0;stroke-opacity:0}63.06%,73.58%{fill-opacity:1;stroke-opacity:1}73.88%,100%{fill-opacity:0;stroke-opacity:0}}@media (prefers-reduced-motion:no-preference){.r5{animation:r5 12s linear infinite}}@keyframes w1{0%,10.99%{fill-opacity:0;stroke-opacity:0}11.29%,80.00%{fill-opacity:1;stroke-opacity:1}86.00%,100%{fill-opacity:0;stroke-opacity:0}}@media (prefers-reduced-motion:no-preference){.w1{animation:w1 12s linear infinite}}@keyframes w2{0%,23.23%{fill-opacity:0;stroke-opacity:0}23.53%,80.00%{fill-opacity:1;stroke-op