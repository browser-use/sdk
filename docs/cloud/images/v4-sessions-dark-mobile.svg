<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 660" width="360" height="660" role="img" aria-labelledby="t d" fill="none"><title id="t">One session ID holds several runs, one conversation and one live browser</title><desc id="d">Runs in one session execute one after another and share the conversation and workspace. 1: runs.create(task) starts the session and its browser. 2: runs.create with the same session_id continues the conversation and reuses the live browser. 3: sessions.send_message with interrupt=False queues behind a busy run and starts when run 2 ends. 4: the browser stops 120 s after the last run ends, unless kept alive; keepAlive 120 to 14400 s (max 4 h) is billed as browser time. 5: a run after the stop keeps the conversation and workspace and gets a new browser.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}@keyframes lv{0%,49.85%{fill-opacity:1;stroke-opacity:1}50.25%,61.51%{fill-opacity:0;stroke-opacity:0}61.91%,100%{fill-opacity:1;stroke-opacity:1}}@keyframes lvd{0%,100%{transform:scale(1)}50%{transform:scale(.45)}}.lvd{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.lv{animation:lv 12s linear infinite}.lvd{animation:lvd 1.6s ease-in-out infinite}}@keyframes r1{0%,1.31%{fill-opacity:0;stroke-opacity:0}1.61%,12.97%{fill-opacity:1;stroke-opacity:1}13.27%,100%{fill-opacity:0;stroke-opacity:0}}@media (prefers-reduced-motion:no-preference){.r1{animation:r1 12s linear infinite}}@keyframes w1{0%,11.76%{fill-opacity:0;stroke-opacity:0}12.06%,80.00%{fill-opacity:1;stroke-opacity:1}86.00%,100%{fill-opacity:0;stroke-opacity:0}}@media (prefers-reduced-motion:no-preference){.w1{animation:w1 12s linear infinite}}@keyframes r2{0%,15.38%{fill-opacity:0;stroke-opacity:0}15.68%,27.04%{fill-opacity:1;stroke-opacity:1}27.34%,100%{fill-opacity:0;stroke-opacity:0}}@media (prefers-reduced-motion:no-preference){.r2{animation:r2 12s linear infinite}}@keyframes w2{0%,25.83%{fill-opacity:0;stroke-opacity:0}26.13%,80.00%{fill-opacity:1;stroke-opacity:1}86.00%,100%{fill-opacity:0;stroke-opacity:0}}@media (prefers-reduced-motion:no-preference){.w2{animation:w2 12s linear infinite}}@keyframes r3{0%,27.84%{fill-opacity:0;stroke-opacity:0}28.14%,39.50%{fill-opacity:1;stroke-opacity:1}39.80%,100%{fill-opacity:0;stroke-opacity:0}}@media (prefers-reduced-motion:no-preference){.r3{animation:r3 12s linear infinite}}@keyframes w3{0%,38.29%{fill-opacity:0;stroke-opacity:0}38.59%,80.00%{fill-opacity:1;stroke-opacity:1}86.00%,100%{fill-opacity:0;stroke-opacity:0}}@media (prefers-reduced-motion:no-preference){.w3{animation:w3 12s linear infinite}}@keyframes r5{0%,61.61%{fill-opacity:0;stroke-opacity:0}61.91%,73.27%{fill-opacity:1;stroke-opacity:1}73.57%,100%{fill-opacity:0;stroke-opacity:0}}@media (prefers-reduced-motion:no-preference){.r5{animation:r5 12s linear infinite}}@keyframes w5{0%,72.06%{fill-opacity:0;stroke-opacity:0}72.36%,80.00%{fill-opacity:1;stroke-opacity:1}86.00%,100%{fill-opacity:0;stroke-opacity:0}}@media (prefers-reduced-motion:no-preference){.w5{animation:w5 12s linear infinite}}@keyframes ph{0%{transform:translateY(0)}80%,100%{transform:translateY(398px)}}@keyframes phl{0%,1%{stroke-opacity:0}4%,80%{stroke-opacity:1}86%,100%{stroke-opacity:0}}@keyframes phd{0%,1.31%{fill-opacity:0;stroke-opacity:0}1.61%,49.85%{fill-opacity:1;stroke-opacity:1}50.25%,61.51%{fill-opacity:0;stroke-opacity:0}61.91%,80%{fill-opacity:1;stroke-opacity:1}86%,100%{fill-opacity:0;stroke-opacity:0}}@media (prefers-reduced-motion:no-preference){.ph{animation:ph 12s linear infinite}.phl{animation:phl 12s linear infinite}.phd{animation:phd 12s linear infinite}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#232328"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.07 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="359" height="659" rx="14"/></clipPath><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5" stroke="#6B6B74" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#FE750E" stroke-width="1.2" stroke-opacity=".6"/></pattern><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FE750E"/><stop offset="1" stop-color="#FE750E" stop-opacity="0"/></linearGradient><linearGradient id="fadeI" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#A1A1AA"/><stop offset="1" stop-color="#A1A1AA" stop-opacity="0"/></linearGradient><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="360" height="660"><feGaussianBlur stdDeviation="4"/></filter></defs><rect x="0.5" y="0.5" width="359" height="659" rx="14" fill="#111113"/><g clip-path="url(#card)"><rect width="360" height="660" fill="url(#dots)"/><rect width="360" height="660" filter="url(#grain)"/></g><rect x="0.5" y="0.5" width="359" height="659" rx="14" fill="none" stroke="#26262B"/><path d="M15 20h10M20 15v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M335 20h10M340 15v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M15 640h10M20 635v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M335 640h10M340 635v10" stroke="#3D3D45" stroke-width="0.75"/><text x="34.0" y="24.5" font-size="10" fill="#6B6B74" letter-spacing="0.08em" class="m">FIG 2.0</text><text x="326.0" y="24.5" font-size="10" fill="#6B6B74" text-anchor="end" letter-spacing="0.08em" class="m">V4 SESSION</text><text tra