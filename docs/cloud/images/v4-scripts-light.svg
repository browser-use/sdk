<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Save, reuse, and repair a browser script</title>
  <desc id="desc">The first run saves a script in a workspace. Later runs reuse and repair it.</desc>
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency=".01" numOctaves="2" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4"/>
    </filter>
  </defs>
  <rect width="1200" height="430" fill="#FFFFFF"/>
  <rect x="20" y="20" width="1160" height="390" fill="none" stroke="#E4E4E7" stroke-width="2"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)">
    <rect x="55" y="150" width="225" height="120" rx="26" fill="#FFFFFF" stroke="#71717A" stroke-width="4"/>
    <path d="M298 210 C335 204 362 217 397 210" stroke="#71717A" stroke-width="4"/>
    <path d="M376 195 L399 210 L377 227" stroke="#71717A" stroke-width="4"/>
    <path d="M415 86 L785 86 L785 322 L415 322 Z" fill="#FFF3E8" stroke="#FE750E" stroke-width="4"/>
    <path d="M415 86 L495 86 L520 58 L635 58 L660 86" fill="#FFF3E8" stroke="#FE750E" stroke-width="4"/>
    <rect x="475" y="156" width="250" height="108" rx="24" fill="#FFFFFF" stroke="#71717A" stroke-width="4"/>
    <path d="M803 210 C840 217 867 204 902 210" stroke="#71717A" stroke-width="4"/>
    <path d="M881 195 L904 210 L882 227" stroke="#71717A" stroke-width="4"/>
    <rect x="920" y="150" width="225" height="120" rx="26" fill="#FFF3E8" stroke="#FE750E" stroke-width="4"/>
    <path d="M1035 286 C1015 364 870 379 710 342 C646 327 592 299 566 278" stroke="#FE750E" stroke-width="4" stroke-dasharray="14 10"/>
    <path d="M587 282 L563 276 L570 300" stroke="#FE750E" stroke-width="4"/>
  </g>
  <g font-family="Virgil, Comic Sans MS, cursive" text-anchor="middle">
    <text x="168" y="227" font-size="44" fill="#18181B">RUN 1</text>
    <text x="600" y="138" font-size="38" fill="#18181B">WORKSPACE</text>
    <text x="600" y="229" font-size="46" fill="#18181B">SCRIPT</text>
    <text x="1032" y="227" font-size="44" fill="#18181B">RUN 2+</text>
  </g>
</svg>
