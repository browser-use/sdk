<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">One session with multiple runs</title>
  <desc id="desc">One session ID contains three sequential runs.</desc>
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency=".01" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4"/>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="#09090B"/>
  <rect x="20" y="20" width="1160" height="360" fill="none" stroke="#27272A" stroke-width="2"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)">
    <rect x="55" y="55" width="1090" height="290" rx="42" fill="#111113" stroke="#71717A" stroke-width="4" stroke-dasharray="16 12"/>
    <rect x="105" y="155" width="250" height="120" rx="26" fill="#24140B" stroke="#FE750E" stroke-width="4"/>
    <path d="M375 215 C410 209 445 221 475 215" stroke="#A1A1AA" stroke-width="4"/>
    <path d="M454 200 L477 215 L455 232" stroke="#A1A1AA" stroke-width="4"/>
    <rect x="485" y="155" width="230" height="120" rx="26" fill="#18181B" stroke="#A1A1AA" stroke-width="4"/>
    <path d="M735 215 C770 221 805 209 835 215" stroke="#A1A1AA" stroke-width="4"/>
    <path d="M814 200 L837 215 L815 232" stroke="#A1A1AA" stroke-width="4"/>
    <rect x="845" y="155" width="250" height="120" rx="26" fill="#18181B" stroke="#A1A1AA" stroke-width="4"/>
  </g>
  <g font-family="Virgil, Comic Sans MS, cursive">
    <text x="92" y="118" font-size="42" fill="#A1A1AA">SESSION ID</text>
    <text x="230" y="232" font-size="44" fill="#F4F4F5" text-anchor="middle">RUN 1</text>
    <text x="600" y="232" font-size="44" fill="#F4F4F5" text-anchor="middle">RUN 2</text>
    <text x="970" y="232" font-size="44" fill="#F4F4F5" text-anchor="middle">RUN 3</text>
  </g>
</svg>
