<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d" fill="none"><title id="t">A run's totalCostUsd covers LLM and search; the session cost adds the browser and proxy</title><desc id="d">The session cost is a stack of four parts: llmCostUsd and searchCostUsd from the run, browserCostUsd and proxyCostUsd from the session's browser. A run's totalCostUsd covers only the lower two. GET /sessions/{id}/cost returns all four, including browser time after the run ends.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#232328"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.07 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="719" height="299" rx="14"/></clipPath><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="300"><feGaussianBlur stdDeviation="4"/></filter></defs><rect x="0.5" y="0.5" width="719" height="299" rx="14" fill="#111113"/><g clip-path="url(#card)"><rect width="720" height="300" fill="url(#dots)"/><rect width="720" height="300" filter="url(#grain)"/></g><rect x="0.5" y="0.5" width="719" height="299" rx="14" fill="none" stroke="#26262B"/><path d="M15 20h10M20 15v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M695 20h10M700 15v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M15 280h10M20 275v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M695 280h10M700 275v10" stroke="#3D3D45" stroke-width="0.75"/><text x="34.0" y="24.5" font-size="10" fill="#A1A1AA" letter-spacing="0.08em" class="m">FIG 8.1</text><text x="686.0" y="24.5" font-size="10" fill="#A1A1AA" text-anchor="end" letter-spacing="0.08em" class="m">BILLING / SESSION COST</text><polyline points="256.7,223.0 326.0,263.0 395.3,223.0" stroke="#3D3D45" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round" stroke-linecap="round"/><polygon points="395.3,191.0 326.0,231.0 326.0,255.0 395.3,215.0" fill="#1A1A1E" stroke="#A1A1AA" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="256.7,191.0 326.0,231.0 326.0,255.0 256.7,215.0" fill="#1A1A1E" stroke="#A1A1AA" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="326.0,151.0 395.3,191.0 326.0,231.0 256.7,191.0" fill="#151518" stroke="#A1A1AA" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="395.3,161.0 326.0,201.0 326.0,225.0 395.3,185.0" fill="#1A1A1E" stroke="#A1A1AA" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="256.7,161.0 326.0,201.0 326.0,225.0 256.7,185.0" fill="#1A1A1E" stroke="#A1A1AA" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="326.0,121.0 395.3,161.0 326.0,201.0 256.7,161.0" fill="#151518" stroke="#A1A1AA" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="395.3,131.0 326.0,171.0 326.0,195.0 395.3,155.0" fill="#1A1A1E" stroke="#A1A1AA" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="256.7,131.0 326.0,171.0 326.0,195.0 256.7,155.0" fill="#1A1A1E" stroke="#A1A1AA" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="326.0,91.0 395.3,131.0 326.0,171.0 256.7,131.0" fill="#151518" stroke="#A1A1AA" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="395.3,101.0 326.0,141.0 326.0,165.0 395.3,125.0" fill="#1A1A1E" stroke="#A1A1AA" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="256.7,101.