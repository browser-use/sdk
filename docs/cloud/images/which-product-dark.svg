    <rect x="760" y="274" width="268" height="136" rx="28" fill="#24140B" stroke="#FE750E" stroke-width="4"/>
    <circle cx="790" cy="302" r="6" fill="#FF5F57"/><circle cx="811" cy="302" r="6" fill="#FEBC2E"/><circle cx="832" cy="302" r="6" fill="#28C840"/>
