<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 565" width="360" height="565" role="img" aria-labelledby="t d" fill="none"><title id="t">OpenAI SDK and Playwright in your application, browser in Browser Use Cloud</title><desc id="d">Inside your application, the OpenAI SDK's AsyncResponsesToolRunner sends tool calls to a small Playwright adapter, which exposes read_page, click, type, and select_option and returns each result. The adapter drives Playwright, which connects over CDP to a cloud browser created with cloud.browsers.create in Browser Use Cloud. The example opens example.com and clicks its link.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}@keyframes fl{to{stroke-dashoffset:-24}}@keyframes spin{to{stroke-dashoffset:-20}}@keyframes live{0%,100%{fill-opacity:1}50%{fill-opacity:.25}}@keyframes key{0%,70%,100%{fill-opacity:0}80%{fill-opacity:.9}}@keyframes chip{0%,70%,100%{fill-opacity:0}80%{fill-opacity:.2}}@keyframes tap{0%,78%{transform:scale(.2);opacity:0}82%{opacity:.9}94%,100%{transform:scale(1);opacity:0}}@media (prefers-reduced-motion:no-preference){.pk{animation:fl 1.2s linear infinite}.rv{animation-direction:reverse}.spin{animation:spin 1.6s linear infinite}.live{animation:live 1.8s ease-in-out infinite}.key{animation:key 4.8s linear infinite}.kc{animation:chip 4.8s linear infinite}.tap{transform-box:fill-box;transform-origin:center;animation:tap 4.8s ease-out infinite}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#232328"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.07 0"/></filter><clipPath id="card"><rec