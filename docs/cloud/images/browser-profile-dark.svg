<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 342" width="720" height="342" role="img" aria-labelledby="t d" fill="none"><title id="t">Log in once, then start later browsers already logged in</title><desc id="d">All three browsers start with the same profileId. Browser 1 logs in, and its state is saved to the profile when it stops. Browsers 2 and 3 load that state and begin logged in.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}@keyframes flow{to{stroke-dashoffset:-16}}@keyframes cur{0%,100%{transform:translate(-14px,-9px)}14%,26%{transform:translate(0,0)}36%{transform:translate(-14px,-9px)}}@keyframes btn{0%,19%,25%,100%{fill-opacity:1}21%,23%{fill-opacity:.45}}@keyframes pks{0%,27%{stroke-opacity:0}31%,52%{stroke-opacity:1}56%,100%{stroke-opacity:0}}@keyframes pkl{0%,54%{stroke-opacity:0}58%,88%{stroke-opacity:1}92%,100%{stroke-opacity:0}}@keyframes wr{0%,36%{fill-opacity:0}46%,60%{fill-opacity:1}74%,100%{fill-opacity:0}}@keyframes ring{0%,4%{stroke-opacity:1}12%,60%{stroke-opacity:.2}68%,100%{stroke-opacity:1}}@media (prefers-reduced-motion:no-preference){.flow{animation:flow 1s linear infinite,pks 7s linear infinite}.load{animation:flow 1s linear infinite,pkl 7s linear infinite}.cur{animation:cur 7s ease-in-out infinite}.btn{animation:btn 7s linear infinite}.wr{animation:wr 7s ease-in-out infinite}.ring{animation:ring 7s ease-in-out infinite}.ring2{animation-delay:.25s}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#232328"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.07 0"/></filter><clipPath id="card"><rect x="0.