<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 462" width="720" height="462" role="img" aria-labelledby="t d" fill="none"><title id="t">Log in once, then start later browsers already logged in</title><desc id="d">1: create one profile per end user with POST /api/v4/profiles. 2: Browser 1 starts with that profileId and logs in once. 3: when Browser 1 stops, its cookies and localStorage are saved to the profile. 4: Browsers 2 and 3 start with the same profileId and load that state, so they begin logged in.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}@keyframes flow{to{stroke-dashoffset:-16}}@keyframes cur{0%,100%{transform:translate(-14px,-9px)}14%,26%{transform:translate(0,0)}36%{transform:translate(-14px,-9px)}}@keyframes btn{0%,19%,25%,100%{fill-opacity:1}21%,23%{fill-opacity:.45}}@keyframes pks{0%,27%{stroke-opacity:0}31%,52%{stroke-opacity:1}56%,100%{stroke-opacity:0}}@keyframes pkl{0%,54%{stroke-opacity:0}58%,88%{stroke-opacity:1}92%,100%{stroke-opacity:0}}@keyframes wr{0%,36%{fill-opacity:0}46%,60%{fill-opacity:1}74%,100%{fill-opacity:0}}@keyframes ring{0%,4%{stroke-opacity:1}12%,60%{stroke-opacity:.2}68%,100%{stroke-opacity:1}}@media (prefers-reduced-motion:no-preference){.flow{animation:flow 1s linear infinite,pks 7s linear infinite}.load{animation:flow 1s linear infinite,pkl 7s linear infinite}.cur{animation:cur 7s ease-in-out infinite}.btn{animation:btn 7s linear infinite}.wr{animation:wr 7s ease-in-out infinite}.ring{animation:ring 7s ease-in-out infinite}.ring2{animation-delay:.25s}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#232328"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.07 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="719" height="461" rx="14"/></clipPath><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="462"><feGaussianBlur stdDeviation="4"/></filter><marker id="oh" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M1.5 1.5 L6.5 5 L1.5 8.5" stroke="#FE750E" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="719" height="461" rx="14" fill="#111113"/><g clip-path="url(#card)"><rect width="720" height="462" fill="url(#dots)"/><rect width="720" height="462" filter="url(#grain)"/></g><rect x="0.5" y="0.5" width="719" height="461" rx="14" fill="none" stroke="#26262B"/><path d="M15 20h10M20 15v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M695 20h10M700 15v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M15 442h10M20 437v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M695 442h10M700 437v10" stroke="#3D3D45" stroke-width="0.75"/><text x="34.0" y="24.5" font-size="10" fill="#6B6B74" letter-spacing="0.08em" class="m">FIG 1.1</text><text x="686.0" y="24.5" font-size="10" fill="#6B6B74" text-anchor="end" letter-spacing="0.08em" class="m">CLOUD BROWSER / PROFILE</text><polyline points="236.3,203.5 290.0,234.5 343.7,203.5" stroke="#3D3D45" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round" stroke-linecap="round"/><line x1="236.3" y1="191.5" x2="236.3" y2="140.5" stroke="#3D3D45" stroke-width="0.8" stroke-dasharray="1 2.5"/><line x1="290.0" y1="222.5" x2="290.0" y2="171.5" stroke="#3D3D45" stroke-width="0.8" stroke-dasharray="1 2.5"/><line x1="343.7" y1="191.5" x2="343.7" y2="140.5" stroke="#3D3D45" stroke-width="0.8" stroke-dasharray="1 2.5"/><polygon points="343.7,184.5 290.0,215.5 290.0,222.5 343.7,191.5" fill="#1A1A1E" stroke="#A1A1AA" stroke-width="0.9" str