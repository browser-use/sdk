<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" width="360" height="290" role="img" aria-labelledby="t d" fill="none"><title id="t">keepAlive holds the browser open so a human can work in it before the next run</title><desc id="d">The first run ends and the browser stays open for up to keepAlive 900 seconds. A human uses the live_view_url in that browser, then a follow-up run with the same session_id continues on the same page.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}@keyframes cur{0%,100%{transform:translate(0,0)}35%{transform:translate(-6px,-4px)}70%{transform:translate(-11px,1px)}}@media (prefers-reduced-motion:no-preference){.cur{animation:cur 6s ease-in-out infinite}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#DDD8CD"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.05 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="359" height="289" rx="14"/></clipPath><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5" stroke="#9A958A" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker><linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#FE750E"/><stop offset="1" stop-color="#FE750E" stop-opacity="0"/></linearGradient><linearGradient id="fadeo" x1="0" x2="1"><stop offset="0" stop-color="#AC4808"/><stop offset="1" stop-color="#AC4808" stop-opacity="0"/></linearGradient><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="360" height="290"><feGaussianBlur stdDeviation="4"/></filter></defs><rect x="0.5" y="0.5" width="359" height="289" rx="14" fill="#FBFAF7"/><g clip-path="url(#card)"><rect width="360" height="290" fill="url(#dots)"/><rect width="360" height="290" filter="url(#grain)"/></g><rect x="0.5" y="0.5" width="359" height="289" rx="14" fill="none" stroke="#E6E2D9"/><path d="M15 20h10M20 15v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M335 20h10M340 15v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M15 270h10M20 265v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M335 270h10M340 265v10" stroke="#C9C3B6" stroke-width="0.75"/><text x="34.0" y="24.5" font-size="10" fill="#5F5B53" letter-spacing="0.08em" class="m">FIG 2.1</text><text x="326.0" y="24.5" font-size="10" fill="#5F5B53" text-anchor="end" letter-spacing="0.08em" class="m">HUMAN IN THE LOOP</text><polygon points="49.0,69.5 68.1,80.5 49.0,91.5 29.9,80.5" stroke="#9A958A" stroke-width="0.8" stroke-dasharray="2 2"/><polygon points="29.9,70.5 49.0,81.5 49.0,86.5 29.9,75.5" fill="#F4F1EA" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round"/><polygon points="68.1,70.5 49.0,81.5 49.0,86.5 68.1,75.5" fill="#F4F1EA" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round"/><polygon points="49.0,59.5 68.1,70.5 49.0,81.5 29.9,70.5" fill="#FFFFFF" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round"/><g transform="matrix(0.8660,0.5,-0.8660,0.5,49.0,59.5)"><path d="M5 6.5l3.5 3l-3.5 3M10.5 14.5h6" stroke="#1B1A17" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></g><g transform="matrix(0.8660,0.5,0,1,44.2,149.2)"><rect x="0" y="-21.5" width="26" height="19" rx="2" fill="#FFFFFF" stroke="#5F5B53" stroke-width="0.9" vector-effect="non-scaling-stroke"/><path d="M0 -17.0H26" stroke="#C9C3B6" stroke-width="0.8" vector-effect="non-scaling-stroke"/><path d="M3.5 -13.5h11M3.5 -10.0h8M3.5 -6.5h13" stroke="#C9C3B6" stroke-width="0.8" vector-effect="non-scaling-stroke"/><g class="cur"><path d="M17 -14.5l0