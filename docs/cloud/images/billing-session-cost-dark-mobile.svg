<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" role="img" aria-labelledby="t d" fill="none"><title id="t">A run's totalCostUsd covers LLM and search; the session cost adds the browser and proxy</title><desc id="d">The session cost is a stack of four parts: llmCostUsd and searchCostUsd from the run, browserCostUsd and proxyCostUsd from the session's browser. A run's totalCostUsd covers only the lower two. GET /api/v4/sessions/{id}/cost returns all four, including browser time after the run ends.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#232328"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.07 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="359" height="299" rx="14"/></clipPath><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="360" height="300"><feGaussianBlur stdDeviation="4"/></filter></defs><rect x="0.5" y="0.5" width="359" height="299" rx="14" fill="#111113"/><g clip-path="url(#card)"><rect width="360" height="300" fill="url(#dots)"/><rect width="360" height="300" filter="url(#grain)"/></g><rect x="0.5" y="0.5" width="359" height="299" rx="14" fill="none" stroke="#26262B"/><path d="M11 16h10M16 11v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M339 16h10M344 11v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M11 284h10M16 279v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M339 284h10M344 279v10" stroke="#3D3D45" stroke-width="0.75"/><text x="28.0" y="24.5" font-size="10" fill="#A1A1AA" letter-spacing=