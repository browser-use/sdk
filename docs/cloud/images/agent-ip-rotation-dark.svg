<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="air-dark-title air-dark-desc">
<title id="air-dark-title">Agent-controlled IP rotation</title>
<desc id="air-dark-desc">An agent keeps the same browser, with its tabs and cart. The first connection, through a US IP, stops working. The agent calls refresh_connection. A new residential connection, through a JP IP, reaches the same website. Routing is illustrative, not a measurement.</desc>
