<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 382" width="720" height="382" role="img" aria-labelledby="t d" fill="none"><title id="t">One workspace keeps files across sessions</title><desc id="d">Your code uploads people.csv to a workspace. A run in session A writes output.json, saved to the workspace when the run ends. A later run in session B gets both files restored at start. Your code downloads output.json.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}@keyframes fr{to{stroke-dashoffset:-24}}@keyframes fl{to{stroke-dashoffset:24}}@keyframes fv{to{stroke-dashoffset:-16}}@keyframes gsA{0%,13.2%{stroke-opacity:1}14%,99.2%{stroke-opacity:.16}100%{stroke-opacity:1}}@keyframes grB{0%,19.2%{stroke-opacity:.16}20%,33.2%{stroke-opacity:1}34%,100%{stroke-opacity:.16}}@keyframes gsB{0%,55.2%{stroke-opacity:.16}56%,65.2%{stroke-opacity:1}66%,100%{stroke-opacity:.16}}@keyframes gdl{0%,67.2%{stroke-opacity:0}68%,77.2%{stroke-opacity:1}78%,100%{stroke-opacity:0}}@keyframes gup{0%,79.2%{stroke-opacity:0}80%,86.2%{stroke-opacity:1}87%,100%{stroke-opacity:0}}@keyframes grA{0%,87.2%{stroke-opacity:.16}88%,95.2%{stroke-opacity:1}96%,100%{stroke-opacity:.16}}@keyframes runA{0%,88%{stroke-opacity:0;fill-opacity:0}90%,100%{stroke-opacity:1;fill-opacity:1}}@keyframes runB{0%,32%{stroke-opacity:0;fill-opacity:0}34%,58%{stroke-opacity:1;fill-opacity:1}60%,100%{stroke-opacity:0;fill-opacity:0}}@keyframes neu{0%,34%{stroke-opacity:1;fill-opacity:1}40%,100%{stroke-opacity:0;fill-opacity:0}}@keyframes cur{0%,100%{transform:translate(0,0)}40%,60%{transform:translate(-14px,-6px)}}@media (prefers-reduced-motion:no-preference){.psAr{animation:fr 1s linear infinite,gsA 12s linear infinite}.psAl{animation:fl 1s linear infinite,gsA 12s linear infinite}.psAv{animation:fv .67s linear infinite,gsA 12s linear infinite}.p