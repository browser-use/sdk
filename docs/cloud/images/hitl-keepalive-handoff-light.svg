<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="t d" fill="none"><title id="t">keepAlive holds the browser open so a human can work in it before the next run</title><desc id="d">The first run ends and the browser stays open for up to keepAlive 900 seconds. A human uses the live_view_url in that browser, then a follow-up run with the same session_id continues on the same page.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}@keyframes cur{0%,100%{transform:translate(0,0)}35%{transform:translate(-6px,-4px)}70%{transform:translate(-11px,1px)}}@media (prefers-reduced-motion:no-preference){.cur{animation:cur 6s ease-in-out infinite}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#DDD8CD"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.05 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="719" height="259" rx="14"/></clipPath><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5" stroke="#9A958A" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker><linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#FE750E"/><stop offset="1" stop-color="#FE750E" stop-opacity="0"/></linearGradient><linearGradient id="fadeo" x1="0" x2="1"><stop offset="0" stop-color="#AC4808"/><stop offset="1" stop-color="#AC4808" stop-opacity="0"/></linearGradient><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="260"><feGaussianBlur stdDeviati