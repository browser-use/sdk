<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d" fill="none"><title id="t">Teach a task once, rerun the saved script later</title><desc id="d">A first run explores the site in a browser, then writes and tests extract_top_stories.py in a workspace. Later runs pass workspace_id to reuse that file; every later run sends a fresh request to the live site, and repairs the script in the workspace if it broke.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}@keyframes fr{to{stroke-dashoffset:-24}}@keyframes fl{to{stroke-dashoffset:24}}@keyframes fd{to{stroke-dashoffset:-16}}@keyframes cur{0%,100%{transform:translate(0,0)}35%,50%{transform:translate(-30px,9px)}75%{transform:translate(-14px,18px)}}@media (prefers-reduced-motion:no-preference){.pkr{animation:fr 1s linear infinite}.pkl{animation:fl 1.5s linear infinite}.pkd{animation:fd 1.2s linear infinite}.cur{animation:cur 6s ease-in-out infinite}}@keyframes pl0{0%,31.8%{fill-opacity:1;stroke-opacity:1}33.3%,100%{fill-opacity:0;stroke-opacity:0}}@media (prefers-reduced-motion:no-preference){.pl0{animation:pl0 7.5s linear infinite}}@keyframes pl1{0%,33.3%{fill-opacity:0;stroke-opacity:0}34.8%,65.2%{fill-opacity:1;stroke-opacity:1}66.7%,100%{fill-opacity:0;stroke-opacity:0}}@media (prefers-reduced-motion:no-preference){.pl1{animation:pl1 7.5s linear infinite}}@keyframes pl2{0%,66.7%{fill-opacity:0;stroke-opacity:0}68.2%,98.5%{fill-opacity:1;stroke-opacity:1}100%{fill-opacity:0;stroke-opacity:0}}@media (prefers-reduced-motion:no-preference){.pl2{animation:pl2 7.5s linear infinite}}@keyframes spin{0%{transform:scaleX(0)}16.7%{transform:scaleX(.5)}33.3%{transform:scaleX(.866)}50%{transform:scaleX(1)}66.7%{transform:scaleX(.866)}83.3%{transform:scaleX(.5)}100%{transform:scaleX(0)}}.ma{display: