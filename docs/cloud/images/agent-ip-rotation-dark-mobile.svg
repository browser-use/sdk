<path class="div" d="M24 114H336"/>
<circle class="dot" cx="40" cy="101" r="3.5"/>
<circle class="dot" cx="52" cy="101" r="3.5"/>
<circle class="dot" cx="64" cy="101" r="3.5"/>
<rect class="chip" x="84" y="94" width="56" height="20" rx="4"/>
<rect class="chip" x="146" y="94" width="56" height="20" rx="4"/>
<text class="t h" x="40" y="144">Same browser</text>
<rect class="chip" x="40" y="160" width="68" height="28" rx="14"/>
