<svg xmlns="http://www.w3.org/2000/svg" width="360" height="600" viewBox="0 0 360 600" role="img" aria-labelledby="air-dark-mobile-title air-dark-mobile-desc">
<title id="air-dark-mobile-title">Agent-controlled IP rotation</title>
<desc id="air-dark-mobile-desc">An agent keeps the same browser, with its tabs and cart. The first connection, through a US IP, stops working. The agent calls refresh_connection. A new residential connection, through a JP IP, reaches the same website. Routing is illustrative, not a measurement.</desc>
<style>
.t{font-family:Inter,Arial,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#EDEDED}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;fill:#EDEDED}
.h{font-size:16px;font-weight:600}
.l{font-size:15px;font-weight:600}
.r{font-size:14px}
.w{font-weight:600}
.s{font-size:14px;fill:#A1A1A1}
.c{text-anchor:middle}
.card{fill:#17181A;stroke:#2E2F32}
.plate{fill:#1F2023}
.chip{fill:#1F2023;stroke:#2E2F32}
.pill{fill:#2A1A0E;stroke:#FE750E;stroke-width:1.5}
.div{stroke:#2E2F32;fill:none}
.ink{stroke:#EDEDED;stroke-width:1.5;fill:none}
.inkf{fill:#EDEDED}
.acc{stroke:#FE750E;stroke-width:2;fill:none}
.af{fill:#FE750E}
.old{stroke:#5C5E62;stroke-width:1.5;fill:none;stroke-dasharray:4 5}
.mut{stroke:#76787D;stroke-width:1.5;fill:none;stroke-linecap:round}
.stop{fill:#101112;stroke:#76787D;stroke-width:1.5}
.dot{fill:#3A3B3E}
.bar{fill:#26272A}
.n1{fill:#2A1A0E;stroke:#FE750E;stroke-width:1.25;stroke-linejoin:round}
.n2{fill:#17181A;stroke:#FE750E;stroke-width:1.25;stroke-linejoin:round}
.n3{fill:#3A2412;stroke:#FE750E;stroke-width:1.25;stroke-linejoin:round}
.o1{fill:#1F2023;stroke:#5C5E62;stroke-width:1.25;stroke-linejoin:round}
.o2{fill:#17181A;stroke:#5C5E62;stroke-width:1.25;stroke-linejoin:round}
.o3{fill:#26272A;stroke:#5C5E62;stroke-width:1.25;stroke-linejoin:round}
</style>
<rect width="360" height="600" fill="#101112"/>
<rect class="card" x="24" y="20" width="312" height="44" rx="10"/>
<text class="t l c" x="180" y="47">Agent</text>
