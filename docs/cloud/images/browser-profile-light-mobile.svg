<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 753" width="360" height="753" role="img" aria-labelledby="t d" fill="none"><title id="t">Log in once, then start later browsers already logged in</title><desc id="d">1: create one profile per end user with POST /api/v4/profiles. 2: Browser 1 starts with that profileId and logs in once. 3: when Browser 1 stops, its cookies and localStorage are saved to the profile. 4: Browsers 2 and 3 start with the same profileId and load that state, so they begin logged in.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}@keyframes flow{to{stroke-dashoffset:-16}}@keyframes cur{0%,100%{transform:translate(-14px,-9px)}14%,26%{transform:translate(0,0)}36%{transform:translate(-14px,-9px)}}@keyframes btn{0%,19%,25%,100%{fill-opacity:1}21%,23%{fill-opacity:.45}}@keyframes pks{0%,27%{stroke-opacity:0}31%,52%{stroke-opacity:1}56%,100%{stroke-opacity:0}}@keyframes pkl{0%,54%{stroke-opacity:0}58%,88%{stroke-opacity:1}92%,100%{stroke-opacity:0}}@keyframes wr{0%,36%{fill-opacity:0}46%,60%{fill-opacity:1}74%,100%{fill-opacity:0}}@keyframes ring{0%,4%{stroke-opacity:1}12%,60%{stroke-opacity:.2}68%,100%{stroke-opacity:1}}@media (prefers-reduced-motion:no-preference){.flow{animation:flow 1s linear infinite,pks 7s linear infinite}.load{animation:flow 1s linear infinite,pkl 7s linear infinite}.cur{animation:cur 7s ease-in-out infinite}.btn{animation:btn 7s linear infinite}.wr{animation:wr 7s ease-in-out infinite}.ring{animation:ring 7s ease-in-out infinite}.ring2{animation-delay:.25s}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#DDD8CD"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.05 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="359" height="752" rx="14"/></clipPath><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="360" height="753"><feGaussianBlur stdDeviation="4"/></filter><marker id="oh" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M1.5 1.5 L6.5 5 L1.5 8.5" stroke="#FE750E" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="359" height="752" rx="14" fill="#FBFAF7"/><g clip-path="url(#card)"><rect width="360" height="753" fill="url(#dots)"/><rect width="360" height="753" filter="url(#grain)"/></g><rect x="0.5" y="0.5" width="359" height="752" rx="14" fill="none" stroke="#E6E2D9"/><path d="M15 20h10M20 15v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M335 20h10M340 15v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M15 733h10M20 728v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M335 733h10M340 728v10" stroke="#C9C3B6" stroke-width="0.75"/><text x="34.0" y="24.5" font-size="10" fill="#9A958A" letter-spacing="0.08em" class="m">FIG 1.1</text><text x="326.0" y="24.5" font-size="10" fill="#9A958A" text-anchor="end" letter-spacing="0.08em" class="m">PROFILE</text><polyline points="53.2,319.1 100.0,346.1 146.8,319.1" stroke="#C9C3B6" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round" stroke-linecap="round"/><line x1="53.2" y1="307.1" x2="53.2" y2="263.1" stroke="#C9C3B6" stroke-width="0.8" stroke-dasharray="1 2.5"/><line x1="100.0" y1="334.1" x2="100.0" y2="290.1" stroke="#C9C3B6" stroke-width="0.8" stroke-dasharray="1 2.5"/><line x1="146.8" y1="307.1" x2="146.8" y2="263.1" stroke="#C9C3B6" stroke-width="0.8" stroke-dasharray="1 2.5"/><polygon points="146.8,301.1 100.0,328.1 100.0,334.1 146.8,307.1" fill="#F4F1EA" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round