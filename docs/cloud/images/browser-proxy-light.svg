<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Browser traffic routed through a residential proxy</title>
  <desc id="desc">A cloud browser sends traffic through a residential proxy before it reaches the target website.</desc>
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency=".01" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4"/>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="#FFFFFF"/>
  <rect x="20" y="20" width="1160" height="360" fill="none" stroke="#E4E4E7" stroke-width="2"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)">
    <rect x="70" y="135" width="270" height="130" rx="28" fill="#FFF3E8" stroke="#FE750E" stroke-width="4"/>
    <path d="M365 200 C400 193 435 207 470 200" stroke="#FE750E" stroke-width="4"/>
    <path d="M449 184 L473 200 L450 217" stroke="#FE750E" stroke-width="4"/>
    <ellipse cx="625" cy="200" rx="135" ry="105" fill="#FFFFFF" stroke="#71717A" stroke-width="4"/>
    <path d="M780 200 C815 207 850 193 885 200" stroke="#FE750E" stroke-width="4"/>
    <path d="M864 184 L888 200 L865 217" stroke="#FE750E" stroke-width="4"/>
    <rect x="905" y="135" width="225" height="130" rx="28" fill="#FFFFFF" stroke="#71717A" stroke-width="4"/>
  </g>
  <g font-family="Virgil, Comic Sans MS, cursive">
    <text x="205" y="216" font-size="42" fill="#18181B" text-anchor="middle">BROWSER</text>
    <text x="625" y="186" font-size="34" fill="#52525B" text-anchor="middle">RESIDENTIAL</text>
    <text x="625" y="235" font-size="44" fill="#18181B" text-anchor="middle">PROXY</text>
    <text x="1018" y="216" font-size="40" fill="#18181B" text-anchor="middle">WEBSITE</text>
  </g>
</svg>
