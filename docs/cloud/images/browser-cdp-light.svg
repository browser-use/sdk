<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Connect your code to a cloud browser with a CDP URL</title>
  <desc id="desc">Your code uses the CDP URL as a connection address to control a Browser Use cloud browser, which then accesses the web.</desc>
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency=".01" numOctaves="2" seed="29" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4"/>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="#FFFFFF"/>
  <rect x="20" y="20" width="1160" height="360" fill="none" stroke="#E4E4E7" stroke-width="2"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)">
    <rect x="55" y="135" width="250" height="130" rx="28" fill="#FFFFFF" stroke="#71717A" stroke-width="4"/>
    <path d="M330 200 C385 190 440 210 510 200" stroke="#FE750E" stroke-width="4"/>
    <path d="M488 184 L513 200 L489 217" stroke="#FE750E" stroke-width="4"/>
    <rect x="535" y="95" width="340" height="210" rx="40" fill="#FFF3E8" stroke="#FE750E" stroke-width="4"/>
    <path d="M900 200 C930 207 955 193 980 200" stroke="#71717A" stroke-width="4"/>
    <path d="M959 184 L983 200 L960 217" stroke="#71717A" stroke-width="4"/>
    <ellipse cx="1065" cy="200" rx="75" ry="75" fill="#FFFFFF" stroke="#71717A" stroke-width="4"/>
  </g>
  <g font-family="Virgil, Comic Sans MS, cursive">
    <text x="180" y="216" font-size="40" fill="#18181B" text-anchor="middle">YOUR CODE</text>
    <text x="420" y="164" font-size="34" fill="#FE750E" text-anchor="middle">CDP URL</text>
    <text x="705" y="184" font-size="40" fill="#18181B" text-anchor="middle">CLOUD</text>
    <text x="705" y="237" font-size="44" fill="#18181B" text-anchor="middle">BROWSER</text>
    <text x="1065" y="216" font-size="40" fill="#18181B" text-anchor="middle">WEB</text>
  </g>
</svg>
