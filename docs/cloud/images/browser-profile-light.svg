<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">One login reused across future browsers</title>
  <desc id="desc">A login is saved as a browser profile containing cookies and login state, then loaded into multiple future browsers.</desc>
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency=".01" numOctaves="2" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4"/>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="#FFFFFF"/>
  <rect x="20" y="20" width="1160" height="360" fill="none" stroke="#E4E4E7" stroke-width="2"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)">
    <rect x="60" y="140" width="270" height="120" rx="28" fill="#FFF3E8" stroke="#FE750E" stroke-width="4"/>
    <path d="M355 200 C390 193 425 207 455 200" stroke="#FE750E" stroke-width="4"/>
    <path d="M434 184 L458 200 L435 217" stroke="#FE750E" stroke-width="4"/>
    <rect x="475" y="55" width="300" height="290" rx="42" fill="#FAFAFA" stroke="#71717A" stroke-width="4" stroke-dasharray="16 12"/>
    <path d="M795 200 C835 178 855 130 890 120" stroke="#71717A" stroke-width="4"/>
    <path d="M868 113 L893 119 L878 140" stroke="#71717A" stroke-width="4"/>
    <path d="M795 200 C835 222 855 270 890 280" stroke="#71717A" stroke-width="4"/>
    <path d="M878 260 L893 281 L868 287" stroke="#71717A" stroke-width="4"/>
    <rect x="910" y="65" width="230" height="105" rx="26" fill="#FFFFFF" stroke="#71717A" stroke-width="4"/>
    <rect x="910" y="230" width="230" height="105" rx="26" fill="#FFFFFF" stroke="#71717A" stroke-width="4"/>
  </g>
  <g font-family="Virgil, Comic Sans MS, cursive">
    <text x="195" y="194" font-size="38" fill="#18181B" text-anchor="middle">LOG IN</text>
    <text x="195" y="239" font-size="38" fill="#18181B" text-anchor="middle">ONCE</text>
    <text x="625" y="133" font-size="44" fill="#52525B" text-anchor="middle">PROFILE</text>
    <text x="625" y="210" font-size="34" fill="#18181B" text-anchor="middle">COOKIES</text>
    <text x="625" y="257" font-size="34" fill="#18181B" text-anchor="middle">+ LOGINS</text>
    <text x="1025" y="133" font-size="34" fill="#18181B" text-anchor="middle">BROWSER 2</text>
    <text x="1025" y="298" font-size="34" fill="#18181B" text-anchor="middle">BROWSER 3</text>
  </g>
</svg>
