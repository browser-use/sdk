<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Task, session, run, and workspace relationship</title>
  <desc id="desc">A task starts a run inside a session. The run reads and writes a persistent workspace.</desc>
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency=".01" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4"/>
    </filter>
  </defs>
  <rect width="1200" height="420" fill="#09090B"/>
  <rect x="20" y="20" width="1160" height="380" fill="none" stroke="#27272A" stroke-width="2"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)">
    <ellipse cx="145" cy="220" rx="105" ry="76" fill="#24140B" stroke="#FE750E" stroke-width="4"/>
    <path d="M265 220 C302 212 330 228 357 220" stroke="#A1A1AA" stroke-width="4"/>
    <path d="M336 205 L359 220 L337 237" stroke="#A1A1AA" stroke-width="4"/>
    <rect x="370" y="55" width="420" height="310" rx="42" fill="#111113" stroke="#71717A" stroke-width="4" stroke-dasharray="16 12"/>
    <rect x="450" y="165" width="260" height="120" rx="26" fill="#24140B" stroke="#FE750E" stroke-width="4"/>
    <path d="M805 220 C842 228 865 212 892 220" stroke="#A1A1AA" stroke-width="4"/>
    <path d="M871 205 L894 220 L872 237" stroke="#A1A1AA" stroke-width="4"/>
    <path d="M910 135 L1145 135 L1145 320 L910 320 Z" fill="#24140B" stroke="#FE750E" stroke-width="4"/>
    <path d="M910 135 L982 135 L1005 108 L1085 108 L1110 135" fill="#24140B" stroke="#FE750E" stroke-width="4"/>
  </g>
  <g font-family="Virgil, Comic Sans MS, cursive">
    <text x="145" y="235" font-size="44" fill="#F4F4F5" text-anchor="middle">TASK</text>
    <text x="408" y="118" font-size="40" fill="#A1A1AA">SESSION</text>
    <text x="580" y="242" font-size="46" fill="#F4F4F5" text-anchor="middle">RUN</text>
    <text x="1028" y="245" font-size="36" fill="#F4F4F5" text-anchor="middle">WORKSPACE</text>
  </g>
</svg>
