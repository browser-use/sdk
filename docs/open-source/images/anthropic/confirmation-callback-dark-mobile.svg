<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 448" width="360" height="448" role="img" aria-labelledby="t d" fill="none"><title id="t">A file_upload call passes the SDK checks, then your confirm callback</title><desc id="d">Claude requests file_upload. The SDK checks that the action is enabled and that file_policy allows the file, then calls your confirm(context) callback. True lets Browser Use run the upload; False or an exception stops it before it runs. Either way the outcome returns to Claude.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}@keyframes fl{to{stroke-dashoffset:-14}}@media (prefers-reduced-motion:no-preference){.fl{animation:fl 1.2s linear infinite}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#232328"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.07 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="359" height="447" rx="14"/></clipPath><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5" stroke="#A1A1AA" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5" stroke="#FE750E" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter></defs><rect x="0.5" y="0.5" width="359" height="447" rx="14" fill="#111113"/><g clip-pa