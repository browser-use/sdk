<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640" role="img" aria-labelledby="t d" fill="none"><title id="t">The model calls three kinds of tool: python, your functions, and finish</title><desc id="d">python(code) runs a cell in the REPL worker process, which drives the browser. A @tools.action function such as get_price(sku) runs in your process with only the arguments the model passes; its return value or error goes back to the model. finish(result) delivers the result and ends the run.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}.m{font-variant-ligatures:none;font-feature-settings:'calt' 0}@keyframes fr{to{stroke-dashoffset:-24}}@keyframes fl{to{stroke-dashoffset:24}}@keyframes led{0%,100%{fill-opacity:1}50%{fill-opacity:.15}}@keyframes blink{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}@keyframes live{0%,100%{fill-opacity:1}50%{fill-opacity:.25}}@media (prefers-reduced-motion:no-preference){.pkr{animation:fr 1s linear infinite}.pkl{animation:fl 1.5s linear infinite}.led{animation:led 2.4s ease-in-out infinite}.blink{animation:blink 1.1s steps(1) infinite}.live{animation:live 1.6s ease-in-out infinite}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#DDD8CD"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.05 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="359" height="639" rx="14"/></clipPath><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" stroke="#5F5B53" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" stroke="#9A958A" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" stroke="#FE750E" stroke-width="1.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="360" height="640"><feGaussianBlur stdDeviation="4"/></filter></defs><rect x="0.5" y="0.5" width="359" height="639" rx="14" fill="#FBFAF7"/><g clip-path="url(#card)"><rect width="360" height="640" fill="url(#dots)"/><rect width="360" height="640" filter="url(#grain)"/></g><rect x="0.5" y="0.5" width="359" height="639" rx="14" fill="none" stroke="#E6E2D9"/><path d="M11 16h10M16 11v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M339 16h10M344 11v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M11 624h10M16 619v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M339 624h10M344 619v10" stroke="#C9C3B6" stroke-width="0.75"/><text x="28.0" y="24.5" font-size="10" fill="#5F5B53" letter-spacing="0.08em" class="m">FIG 1.5</text><text x="332.0" y="24.5" font-size="10" fill="#5F5B53" text-anchor="end" letter-spacing="0.08em" class="m">TOOLS</text><polyline points="73.6,133.0 110.0,154.0 146.4,133.0" stroke="#C9C3B6" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="73.6,145.0 110.0,166.0 146.4,145.0" stroke="#C9C3B6" stroke-width="0.8" stroke-dasharray="1 3" stroke-linejoin="round" stroke-linecap="round"/><polygon points="146.4,121.0 110.0,142.0 110.0,150.0 146.4,129.0" fill="#F4F1EA" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="73.6,121.0 