<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d" fill="none"><title id="t">allowed_domains is enforced in three layers</title><desc id="d">A navigation to an allowed domain passes all three layers to the browser. A disallowed URL is caught by the first layer that sees it: the REPL helpers raise PermissionError; the browser's own CDP guard fails a link click, redirect, popup or JavaScript navigation; after each cell, any tab still on a disallowed page is reset to about:blank. Browser('chrome') uses layers 1 and 3 only.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}.m{font-variant-ligatures:none;font-feature-settings:'calt' 0}@keyframes fr{to{stroke-dashoffset:-24}}@keyframes fl{to{stroke-dashoffset:24}}@keyframes led{0%,100%{fill-opacity:1}50%{fill-opacity:.15}}@keyframes blink{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}@keyframes live{0%,100%{fill-opacity:1}50%{fill-opacity:.25}}@media (prefers-reduced-motion:no-preference){.pkr{animation:fr 1s linear infinite}.pkl{animation:fl 1.5s linear infinite}.led{animation:led 2.4s ease-in-out infinite}.blink{animation:blink 1.1s steps(1) infinite}.live{animation:live 1.6s ease-in-out infinite}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#DDD8CD"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.05 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="719" height="329" rx="14"/></clipPath><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" stroke="#5F5B53" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" stroke="#9A958A" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" stroke="#FE750E" stroke-width="1.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="330"><feGaussianBlur stdDeviation="4"/></filter></defs><rect x="0.5" y="0.5" width="719" height="329" rx="14" fill="#FBFAF7"/><g clip-path="url(#card)"><rect width="720" height="330" fill="url(#dots)"/><rect width="720" height="330" filter="url(#grain)"/></g><rect x="0.5" y="0.5" width="719" height="329" rx="14" fill="none" stroke="#E6E2D9"/><path d="M15 20h10M20 15v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M695 20h10M700 15v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M15 310h10M20 305v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M695 310h10M700 305v10" stroke="#C9C3B6" stroke-width="0.75"/><text x="34.0" y="24.5" font-size="10" fill="#5F5B53" letter-spacing="0.08em" class="m">FIG 2.1</text><text x="686.0" y="24.5" font-size="10" fill="#5F5B53" text-anchor="end" letter-spacing="0.08em" class="m">DOMAINS / THREE LAYERS</text><polygon points="75.5,106.0 163.9,157.0 132.7,175.0 44.4,124.0" stroke="#C9C3B6" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round" stroke-linecap="round"/><g transform="matrix(0.8660,0.5,0,1,73.8,115.0)"><rect x="8" y="-50" width="78" height="50" rx="5" fill="#FBFAF7" stroke="#C9C3B6" stroke-width="0.9" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/></g><g transform="matrix(0.8660,0.5,0,1,60.0,123.0)"><