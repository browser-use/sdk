<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 452" width="1180" height="452" role="img" aria-labelledby="t d" fill="none"><title id="t">Agent = harness + browser</title><desc id="d">Your task goes to the agent: a browser harness, the Python REPL where the model calls new_tab, click_at_xy and js, drives a stealth browser, and the agent returns the result.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}.flow{stroke-width:2;stroke-dasharray:2 7;stroke-linecap:round;fill:none}@keyframes flow{to{stroke-dashoffset:-18}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@media (prefers-reduced-motion:no-preference){.flow{animation:flow 1.6s linear infinite}.blink{animation:blink 1.1s steps(1) infinite}}</style><rect x="0.5" y="0.5" width="1179" height="451" rx="14" fill="#0B0B0B" stroke="#1F1F1F"/><g transform="translate(24,40)"><rect x="246" y="22" width="634" height="356" rx="18" fill="none" stroke="#5B9BF8" stroke-opacity=".6" stroke-width="1.3" stroke-dasharray="6 6"/><rect x="437" y="10" width="252" height="24" rx="12" fill="#141414" stroke="#EDEDED" stroke-width="1.3"/><rect x="453" y="17.5" width="9" height="9" rx="2" fill="#5B9BF8"/><text x="570" y="26" class="m" font-size="11.5" font-weight="500" fill="#EDEDED" text-anchor="middle" letter-spacing=".06em">AGENT = HARNESS + BROWSER</text><text x="0" y="121" class="m" font-size="11.5" font-weight="500" fill="#A1A1A1" letter-spacing=".1em">YOUR TASK</text><rect x="5" y="140" width="200" height="116" rx="12" fill="#1C1C1C" stroke="#EDEDED" stroke-width="1.5"/><rect x="0" y="135" width="200" height="116" rx="12" fill="#141414" stroke="#EDEDED" stroke-width="1.5"/><text x="18" y="173" class="s" font-size="17" font-weight="500" fill="#EDEDED">Buy trail shoes,</text><text x="18" y="197" class="s" font-size="17" font-weight="500" fill="#EDEDED">size 42,</text><text x="18" y="221" class="s" font-size="17" font-weight="500" fill="#EDEDED">under $120.</text><rect class="blink" x="124" y="207" width="9" height="18" fill="#EDEDED"/><path class="flow" d="M214 193 L260 193" stroke="#A1A1A1"/><path d="M253 187 l7 6 l-7 6" fill="none" stroke="#A1A1A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="270" y="95.5" width="9" height="9" rx="2" fill="#4FC1B0"/><text x="285" y="104" class="m" font-size="11.5" font-weight="500" fill="#A1A1A1" letter-spacing=".1em">BROWSER HARNESS</text><rect x="275" y="123" width="210" height="150" rx="12" fill="#16302C" stroke="#EDEDED" stroke-width="1.5"/><rect x="270" y="118" width="210" height="150" rx="12" fill="#141414" stroke="#EDEDED" stroke-width="1.5"/><circle cx="288" cy="136" r="4" fill="#EDEDED"/><circle cx="302" cy="136" r="4" fill="none" stroke="#EDEDED" stroke-width="1.3"/><circle cx="316" cy="136" r="4" fill="none" stroke="#EDEDED" stroke-width="1.3"/><text x="466" y="140" class="m" font-size="11.5" font-weight="400" fill="#A1A1A1" text-anchor="end">python</text><line x1="270" y1="152" x2="480" y2="152" stroke="#EDEDED" stroke-width="1.2"/><text x="288" y="182" class="m" font-size="13" font-weight="400" fill="#EDEDED">new_tab("shop.com")</text><text x="288" y="210" class="m" font-size="13" font-weight="400" fill="#4FC1B0">click_at_xy(612, 418)</text><text x="288" y="238" class="m" font-size="13" font-weight="400" fill="#EDEDED">js("cart.count")</text><text x="275" y="296" class="m" font-size="11.5" font-weight="400" fill="#A1A1A1">the model writes each cell</text><path class="flow" d="M490 193 L516 193" stroke="#A1A1A1"/><path d="M509 187 l7 6 l-7 6" fill="none" stroke="#A1A1A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="526" y="55.5" width="9" height="9" rx="2" fill="#F2A03D"/><text x="541" y="64" class="m" font-size="11.5" font-weight="500" fill="#A1A1A1" letter-spacing=".1em">STEALTH BROWSER</text><rect x="531" y="83" width="330" he