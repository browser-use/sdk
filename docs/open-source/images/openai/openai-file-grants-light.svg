<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" role="img" aria-labelledby="t d" fill="none"><title id="t">File transfers need a grant from your application</title><desc id="d">Your application calls driver.grant_upload or driver.grant_download and passes the returned grant_id to the OpenAI model. The model uses the upload_file or download_file tool with that grant_id. The driver then moves one file, up to 10 MB: an upload into the Cloud browser's file input, or a download to a new file on your application host.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}@keyframes fw{to{stroke-dashoffset:-24}}@media (prefers-reduced-motion:no-preference){.fw{animation:fw 1.3s linear infinite}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#DDD8CD"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.05 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="719" height="449" rx="14"/></clipPath><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" stroke="#5F5B53" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" stroke="#FE750E" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="450"><feGaussianBlur stdDeviation="4"/></filt