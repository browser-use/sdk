<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 656" width="360" height="656" role="img" aria-labelledby="t d" fill="none"><title id="t">The tool runner relays the model's calls to the browser and to Bash</title><desc id="d">The OpenAI model sends function calls to the OpenAI SDK tool runner, which passes browser calls to the Browser Use Cloud browser on example.com and bash to your app host, where it writes outputs/summary.md. A typical run uses the navigate, read_page, click (on Learn more), read_page, and bash tools. Native compaction shrinks the context only if it passes 60,000 tokens.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}@keyframes live{0%,100%{fill-opacity:1}50%{fill-opacity:.25}}@media (prefers-reduced-motion:no-preference){.live{animation:live 1.8s ease-in-out infinite}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#232328"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.07 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="359" height="655" rx="14"/></clipPath><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5" stroke="#A1A1AA" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5" stroke="#6B6B74" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5" stroke="#FE750E" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="360" height="656"><feGaussianBlur stdDeviation="4"/></filter></defs><rect x="0.5" y="0.5" width="359" height="655" rx="14" fill="#111113"/><g clip-path="url(#card)"><rect width="360" height="656" fill="url(#dots)"/><rect width="360" height="656" filter="url(#grain)"/></g><rect x="0.5" y="0.5" width="359" height="655" rx="14" fill="none" stroke="#26262B"/><path d="M15 20h10M20 15v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M335 20h10M340 15v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M15 636h10M20 631v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M335 636h10M340 631v10" stroke="#3D3D45" stroke-width="0.75"/><text x="34.0" y="24.5" font-size="10" fill="#A1A1AA" letter-spacing="0.08em" class="m">FIG 9.1</text><text x="326.0" y="24.5" font-size="10" fill="#A1A1AA" text-anchor="end" letter-spacing="0.08em" class="m">TOOL LOOP</text><polygon points="62.0,70.0 100.1,92.0 62.0,114.0 23.9,92.0" stroke="#6B6B74" stroke-width="0.8" stroke-dasharray="2 2"/><polygon points="23.9,67.0 62.0,89.0 62.0,107.0 23.9,85.0" fill="#1A1A1E" stroke="#A1A1AA" stroke-width="0.9" stroke-linejoin="round"/><polygon points="100.1,67.0 62.0,89.0 62.0,107.0 100.1,85.0" fill="#1A1A1E" stroke="#A1A1AA" stroke-width="0.9" stroke-linejoin="round"/><polygon points="62.0,45.0 100.1,67.0 62.0,89.0 23.9,67.0" fill="#151518" stroke="#A1A1AA" stroke-width="0.9" stroke-linejoin="round"/><g transform="matrix(0.8660,0.5,-0.8660,0.5,62.0,45.0)"><path d="M8 9H30" stroke="#3D3D45" stroke-width="0.9" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="M8 14.5H36" stroke="#3D3D45" stroke-width="0.9" stroke-linecap="round" vector-effect="non-scaling-stroke"/><rect x="6" y="21" width="32" height="15" rx="3.5" fill="#1A1A1E" stroke="#A1A1AA" stroke-width="0