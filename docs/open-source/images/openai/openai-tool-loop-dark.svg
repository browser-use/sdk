<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" width="720" height="456" role="img" aria-labelledby="t d" fill="none"><title id="t">The tool runner relays the model's calls to the browser and to Bash</title><desc id="d">The OpenAI model sends function calls to the OpenAI SDK tool runner, which passes browser calls to the Browser Use Cloud browser on example.com and bash to your app host, where it writes outputs/summary.md. A typical run uses the navigate, read_page, click (on Learn more), read_page, and bash tools. Native compaction shrinks the context only if it passes 60,000 tokens.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}@keyframes live{0%,100%{fill-opacity:1}50%{fill-opacity:.25}}@media (prefers-reduced-motion:no-preference){.live{animation:live 1.8s ease-in-out infinite}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#232328"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.07 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="719" height="455" rx="14"/></clipPath><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5" stroke="#A1A1AA" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5" stroke="#6B6B74" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7"