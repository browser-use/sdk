<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" role="img" aria-labelledby="t d" fill="none"><title id="t">Compaction: older steps become one checkpoint, the last two steps stay</title><desc id="d">When the history passes 75% of max_context_chars, or 65% of the model's window in tokens, everything before the last two steps is replaced in the next request by one checkpoint: a summary by the same model, the original task verbatim, and the path of an evidence archive in the workspace. The last two steps are sent unchanged. Gateway and OpenAI models compact server-side past 150k tokens instead.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}.m{font-variant-ligatures:none;font-feature-settings:'calt' 0}@keyframes fr{to{stroke-dashoffset:-24}}@keyframes fl{to{stroke-dashoffset:24}}@keyframes led{0%,100%{fill-opacity:1}50%{fill-opacity:.15}}@keyframes blink{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}@keyframes live{0%,100%{fill-opacity:1}50%{fill-opacity:.25}}@media (prefers-reduced-motion:no-preference){.pkr{animation:fr 1s linear infinite}.pkl{animation:fl 1.5s linear infinite}.led{animation:led 2.4s ease-in-out infinite}.blink{animation:blink 1.1s steps(1) infinite}.live{animation:live 1.6s ease-in-out infinite}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#DDD8CD"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.05 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="719" height="371" rx="14"/></clipPath><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" stroke="#5F5B53" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" stroke="#9A958A" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" stroke="#FE750E" stroke-width="1.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="372"><feGaussianBlur stdDeviation="4"/></filter></defs><rect x="0.5" y="0.5" width="719" height="371" rx="14" fill="#FBFAF7"/><g clip-path="url(#card)"><rect width="720" height="372" fill="url(#dots)"/><rect width="720" height="372" filter="url(#grain)"/></g><rect x="0.5" y="0.5" width="719" height="371" rx="14" fill="none" stroke="#E6E2D9"/><path d="M15 20h10M20 15v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M695 20h10M700 15v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M15 352h10M20 347v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M695 352h10M700 347v10" stroke="#C9C3B6" stroke-width="0.75"/><text x="34.0" y="24.5" font-size="10" fill="#5F5B53" letter-spacing="0.08em" class="m">FIG 3.2</text><text x="686.0" y="24.5" font-size="10" fill="#5F5B53" text-anchor="end" letter-spacing="0.08em" class="m">LONG TASKS / COMPACTION</text><text x="44.0" y="78.0" font-size="11" fill="#5F5B53" font-weight="500" letter-spacing="0.08em" class="m">HISTORY</text><rect x="44.0" y="92.0" width="63.1" height="30" rx="5" fill="#FFFFFF" stroke="#5F5B53" stroke-width="0.9"/><text x="75.6" y="111.0" font-size="11" fill="#1B1A17" text-anchor="middle" class="m">task</text><rect x="115.1" y="92.0" width="63.1" height="30" rx="5" fill="#FFFFFF" stroke="#5F5B53" stroke-width="0.9"/><text x="146.7" y="111.0" font-size="11" fill="#1B1A17" text-anchor="middle" class="m">step 1</text><rect x="186.2" y="92.0" width="63.1" height="30" rx="5" fill="#FFFFFF" stroke="#5F5B53" stroke-width="0.9"/><text x="217.8" y="111.0" font-size="11" fill="#1B1A17" text-anchor="middle" class="m">step 2</text><rect x="257.3" y="92.0" width="63.1" height="30" rx="5" fill="#FFFFFF" stroke="#5F5B53" stroke-width="0.9"/><text x="288.9" y="111.0" font-size="11" fill="#1B1A17" text-anchor="middle" class="m">step 3</text><rect x="328.4" y="92.0" width="63.1" height="30" rx="5" fill="#FFFFFF" stroke="#5F5B53" stroke-width="0.9"/><text x="360.0" y="111.0" font-size="11" fill="#1B1A17" text-anchor="middle" class="m">step 4</text><rect x="399.6" y="92.0" width="63.1" height="30" rx="5" fill="#FFFFFF" stroke="#5F5B53" stroke-width="0.9"/><text x="431.1" y="111.0" font-size="11" fill="#1B1A17" text-anchor="middle" class="m">step 5</text><rect x="470.7" y="92.0" width="63.1" height="30" rx="5" fill="#FFFFFF" stroke="#5F5B53" stroke-width="0.9"/><text x="502.2" y="111.0" font-size="11" fill="#1B1A17" text-anchor="middle" class="m">step 6</text><rect x="541.8" y="92.0" width="63.1" height="30" rx="5" fill="#FFE6D2" stroke="#FE750E" stroke-width="0.9"/><text x="573.3" y="111.0" font-size="11" fill="#AC4808" font-weight="500" text-anchor="middle" class="m">step 7</text><rect x="612.9" y="92.0" width="63.1" height="30" rx="5" fill="#FFE6D2" stroke="#FE750E" stroke-width="0.9"/><text x="644.4" y="111.0" font-size="11" fill="#AC4808" font-weight="500" text-anchor="middle" class="m">step 8</text><line x1="537.8" y1="70" x2="537.8" y2="132" stroke="#1B1A17" stroke-width="1" stroke-dasharray="2 3"/><text x="531.8" y="78.0" font-size="11" fill="#1B1A17" font-weight="500" text-anchor="end" class="m">75% of max_context_chars</text><path d="M44.0 138V144H533.8V138" stroke="#5F5B53" stroke-width="1"/><text x="288.9" y="160.0" font-size="11" fill="#5F5B53" text-anchor="middle" class="m">summarized</text><path d="M541.8 138V144H676.0V138" stroke="#FE750E" stroke-width="1"/><text x="608.9" y="160.0" font-size="11" fill="#AC4808" text-anchor="middle" class="m">kept</text><text x="44.0" y="200.0" font-size="11" fill="#5F5B53" font-weight="500" letter-spacing="0.08em" class="m">NEXT REQUEST</text><rect x="48.0" y="218.0" width="300.0" height="94.0" rx="8" fill="#F4F1EA" stroke="#C9C3B6" stroke-width="0.9"/><rect x="44.0" y="214.0" width="300.0" height="94.0" rx="8" fill="#FFFFFF" stroke="#5F5B53" stroke-width="0.9"/><line x1="44.0" y1="236.0" x2="344.0" y2="236.0" stroke="#C9C3B6" stroke-width="0.8"/><text x="56.0" y="229.0" font-size="11" fill="#5F5B53" class="m">checkpoint</text><text x="56.0" y="254.0" font-size="11" fill="#AC4808" class="m">summary by the same model</text><text x="56.0" y="272.0" font-size="11" fill="#1B1A17" class="m">your task, verbatim</text><text x="56.0" y="290.0" font-size="11" fill="#1B1A17" class="m">archive: .browser-use/context/</text><path d="M194.0 168.0 L194.0 208.0" stroke="#5F5B53" stroke-width="1" marker-end="url(#ah)"/><path class="pkr" d="M194.0 168.0 L194.0 208.0" stroke="#5F5B53" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 21"/><rect x="368.0" y="244.0" width="63.1" height="30" rx="5" fill="#FFE6D2" stroke="#FE750E" stroke-width="0.9"/><text x="399.6" y="263.0" font-size="11" fill="#AC4808" font-weight="500" text-anchor="middle" class="m">step 7</text><rect x="439.1" y="244.0" width="63.1" height="30" rx="5" fill="#FFE6D2" stroke="#FE750E" stroke-width="0.9"/><text x="470.7" y="263.0" font-size="11" fill="#AC4808" font-weight="500" text-anchor="middle" class="m">step 8</text><path d="M608.9 168.0 L608.9 210.0 Q608.9 218.0 600.9 218.0 L443.1 218.0 Q435.1 218.0 435.1 226.0 L435.1 238.0" stroke="#5F5B53" stroke-width="1" marker-end="url(#ah)"/><path class="pkr" d="M608.9 168.0 L608.9 210.0 Q608.9 218.0 600.9 218.0 L443.1 218.0 Q435.1 218.0 435.1 226.0 L435.1 238.0" stroke="#5F5B53" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 21"/><text x="44.0" y="338.0" font-size="11" fill="#5F5B53" class="m">Gateway and OpenAI models: compacted server-side past 150k tokens.</text></svg>