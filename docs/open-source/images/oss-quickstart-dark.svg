<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" width="720" height="296" role="img" aria-labelledby="t d" fill="none"><title id="t">First run: your code in the middle, the gateway model and a cloud browser on either side</title><desc id="d">agent.py runs the agent loop and its Python REPL on your machine. Model requests go to the Browser Use gateway (bu-fast), and the REPL drives a Browser Use Cloud browser over CDP. One Browser Use key from browser-use login runs both.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}.m{font-variant-ligatures:none;font-feature-settings:'calt' 0}@keyframes fr{to{stroke-dashoffset:-24}}@keyframes fl{to{stroke-dashoffset:24}}@keyframes led{0%,100%{fill-opacity:1}50%{fill-opacity:.15}}@keyframes blink{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}@keyframes live{0%,100%{fill-opacity:1}50%{fill-opacity:.25}}@media (prefers-reduced-motion:no-preference){.pkr{animation:fr 1s linear infinite}.pkl{animation:fl 1.5s linear infinite}.led{animation:led 2.4s ease-in-out infinite}.blink{animation:blink 1.1s steps(1) infinite}.live{animation:live 1.6s ease-in-out infinite}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#232328"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.07 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="719" height="295" rx="14"/></clipPath><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" stroke="#A1A1AA" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap