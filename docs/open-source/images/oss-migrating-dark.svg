<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" width="720" height="436" role="img" aria-labelledby="t d" fill="none"><title id="t">Migrating: a 0.x step picks an action from a DOM dump, a 1.0 step writes a Python cell</title><desc id="d">In 0.x the model read an indexed DOM dump and picked one action, like click(index=12), for a local Chromium. In 1.0 the model reads the output of its last cell and writes the next Python cell, which the REPL runs with browser helpers and raw CDP against a cloud browser by default. Agent, Browser, Tools, run() and final_result() keep working.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}@keyframes fr{to{stroke-dashoffset:-24}}@keyframes fl{to{stroke-dashoffset:24}}@keyframes led{0%,100%{fill-opacity:1}50%{fill-opacity:.15}}@keyframes blink{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}@keyframes live{0%,100%{fill-opacity:1}50%{fill-opacity:.25}}@media (prefers-reduced-motion:no-preference){.pkr{animation:fr 1s linear infinite}.pkl{animation:fl 1.5s linear infinite}.led{animation:led 2.4s ease-in-out infinite}.blink{animation:blink 1.1s steps(1) infinite}.live{animation:live 1.6s ease-in-out infinite}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#232328"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.07 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="719" height="435" rx="14"/></clipPath><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" stroke="#A1A1AA" stroke-width="1.3" fill