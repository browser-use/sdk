<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 412" width="360" height="412" role="img" aria-labelledby="t d" fill="none"><title id="t">Compaction: older steps become one checkpoint, the last two steps stay</title><desc id="d">When the history passes 75% of max_context_chars, or 65% of the model's window in tokens, everything before the last two steps is replaced in the next request by one checkpoint: a summary by the same model, the original task verbatim, and the path of an evidence archive in the workspace. The last two steps are sent unchanged. Gateway and OpenAI models compact server-side past 150k tokens instead.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}.m{font-variant-ligatures:none;font-feature-settings:'calt' 0}@keyframes fr{to{stroke-dashoffset:-24}}@keyframes fl{to{stroke-dashoffset:24}}@keyframes led{0%,100%{fill-opacity:1}50%{fill-opacity:.15}}@keyframes blink{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}@keyframes live{0%,100%{fill-opacity:1}50%{fill-opacity:.25}}@media (prefers-reduced-motion:no-preference){.pkr{animation:fr 1s linear infinite}.pkl{animation:fl 1.5s linear infinite}.led{animation:led 2.4s ease-in-out infinite}.blink{animation:blink 1.1s steps(1) infinite}.live{animation:live 1.6s ease-in-out infinite}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#232328"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.07 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="359" height="411" rx="14"/></clipPath><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" stroke="#A1A1AA" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" stroke="#6B6B74" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" stroke="#FE750E" stroke-width="1.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="360" height="412"><feGaussianBlur stdDeviation="4"/></filter></defs><rect x="0.5" y="0.5" width="359" height="411" rx="14" fill="#111113"/><g clip-path="url(#card)"><rect width="360" height="412" fill="url(#dots)"/><rect width="360" height="412" filter="url(#grain)"/></g><rect x="0.5" y="0.5" width="359" height="411" rx="14" fill="none" stroke="#26262B"/><path d="M11 16h10M16 11v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M339 16h10M344 11v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M11 396h10M16 391v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M339 396h10M344 391v10" stroke="#3D3D45" stroke-width="0.75"/><text x="28.0" y="24.5" font-size="10" fill="#A1A1AA" letter-spacing="0.08em" class="m">FIG 3.2</text><text x="332.0" y="24.5" font-size="10" fill="#A1A1AA" text-anchor="end" letter-spacing="0.08em" class="m">LONG TASKS</text><text x="26.0" y="78.0" font-size="11" fill="#A1A1AA" font-weight="500" letter-spacing="0.08em" class="m">HISTORY</text><rect x="26.0" y="92.0" width="31.5" height="30" rx="5" fill="#151518" stroke="#A1A1AA" stroke-width="0.9"/><text x="41.8" y="111.0" font-size="11" fill="#EDEDEF" text-anchor="middle" class="m">task</text><rect x="65.5" y="92.0" width="31.5" height="30" rx="5" fill="#151518" stroke="#A1A1AA" stroke-width="0.9"/><text x="81.2" y="111.0" font-size="11" fill="#EDEDEF" text-anchor="middle" class="m">1</text><rect x="105.0" y="92.0" width="31.5" height="30" rx="5" fill="#151518" stroke="#A1A1AA" stroke-width="0.9"/><text x="120.8" y="111.0" font-size="11" fill="#EDEDEF" text-anchor="middle" class="m">2</text><rect x="144.5" y="92.0" width="31.5" height="30" rx="5" fill="#151518" stroke="#A1A1AA" stroke-width="0.9"/><text x="160.2" y="111.0" font-size="11" fill="#EDEDEF" text-anchor="middle" class="m">3</text><rect x="184.0" y="92.0" width="31.5" height="30" rx="5" fill="#151518" stroke="#A1A1AA" stroke-width="0.9"/><text x="199.8" y="111.0" font-size="11" fill="#EDEDEF" text-anchor="middle" class="m">4</text><rect x="223.5" y="92.0" width="31.5" height="30" rx="5" fill="#151518" stroke="#A1A1AA" stroke-width="0.9"/><text x="239.2" y="111.0" font-size="11" fill="#EDEDEF" text-anchor="middle" class="m">5</text><rect x="263.0" y="92.0" width="31.5" height="30" rx="5" fill="#3A2214" stroke="#FE750E" stroke-width="0.9"/><text x="278.8" y="111.0" font-size="11" fill="#FF8A3D" font-weight="500" text-anchor="middle" class="m">6</text><rect x="302.5" y="92.0" width="31.5" height="30" rx="5" fill="#3A2214" stroke="#FE750E" stroke-width="0.9"/><text x="318.2" y="111.0" font-size="11" fill="#FF8A3D" font-weight="500" text-anchor="middle" class="m">7</text><line x1="259.0" y1="70" x2="259.0" y2="132" stroke="#EDEDEF" stroke-width="1" stroke-dasharray="2 3"/><text x="253.0" y="78.0" font-size="11" fill="#EDEDEF" font-weight="500" text-anchor="end" class="m">75% of context</text><path d="M26.0 138V144H255.0V138" stroke="#A1A1AA" stroke-width="1"/><text x="140.5" y="160.0" font-size="11" fill="#A1A1AA" text-anchor="middle" class="m">summarized</text><path d="M263.0 138V144H334.0V138" stroke="#FE750E" stroke-width="1"/><text x="298.5" y="160.0" font-size="11" fill="#FF8A3D" text-anchor="middle" class="m">kept</text><text x="26.0" y="200.0" font-size="11" fill="#A1A1AA" font-weight="500" letter-spacing="0.08em" class="m">NEXT REQUEST</text><rect x="30.0" y="218.0" width="236.0" height="94.0" rx="8" fill="#1A1A1E" stroke="#3D3D45" stroke-width="0.9"/><rect x="26.0" y="214.0" width="236.0" height="94.0" rx="8" fill="#151518" stroke="#A1A1AA" stroke-width="0.9"/><line x1="26.0" y1="236.0" x2="262.0" y2="236.0" stroke="#3D3D45" stroke-width="0.8"/><text x="38.0" y="229.0" font-size="11" fill="#A1A1AA" class="m">checkpoint</text><text x="38.0" y="254.0" font-size="11" fill="#FF8A3D" class="m">summary by the same model</text><text x="38.0" y="272.0" font-size="11" fill="#EDEDEF" class="m">your task, verbatim</text><text x="38.0" y="290.0" font-size="11" fill="#EDEDEF" class="m">archive: .browser-use/context/</text><path d="M144.0 168.0 L144.0 208.0" stroke="#A1A1AA" stroke-width="1" marker-end="url(#ah)"/><path class="pkr" d="M144.0 168.0 L144.0 208.0" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 21"/><rect x="286.0" y="244.0" width="20.0" height="30" rx="5" fill="#3A2214" stroke="#FE750E" stroke-width="0.9"/><text x="296.0" y="263.0" font-size="11" fill="#FF8A3D" font-weight="500" text-anchor="middle" class="m">6</text><rect x="314.0" y="244.0" width="20.0" height="30" rx="5" fill="#3A2214" stroke="#FE750E" stroke-width="0.9"/><text x="324.0" y="263.0" font-size="11" fill="#FF8A3D" font-weight="500" text-anchor="middle" class="m">7</text><path d="M298.5 168.0 L298.5 212.2 Q298.5 218.0 304.2 218.0 L304.2 218.0 Q310.0 218.0 310.0 223.8 L310.0 238.0" stroke="#A1A1AA" stroke-width="1" marker-end="url(#ah)"/><path class="pkr" d="M298.5 168.0 L298.5 212.2 Q298.5 218.0 304.2 218.0 L304.2 218.0 Q310.0 218.0 310.0 223.8 L310.0 238.0" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 21"/><text x="26.0" y="338.0" font-size="11" fill="#A1A1AA" class="m">Gateway, OpenAI: server-side</text><text x="26.0" y="354.0" font-size="11" fill="#A1A1AA" class="m">past 150k tokens.</text></svg>