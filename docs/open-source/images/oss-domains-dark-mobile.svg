<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 712" width="360" height="712" role="img" aria-labelledby="t d" fill="none"><title id="t">allowed_domains is enforced in three layers</title><desc id="d">A navigation to an allowed domain passes all three layers to the browser. A disallowed URL is caught by the first layer that sees it: the REPL helpers raise PermissionError; the browser's own CDP guard fails a link click, redirect, popup or JavaScript navigation; after each cell, any tab still on a disallowed page is reset to about:blank. Browser('chrome') uses layers 1 and 3 only.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}@keyframes fr{to{stroke-dashoffset:-24}}@keyframes fl{to{stroke-dashoffset:24}}@keyframes led{0%,100%{fill-opacity:1}50%{fill-opacity:.15}}@keyframes blink{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}@keyframes live{0%,100%{fill-opacity:1}50%{fill-opacity:.25}}@media (prefers-reduced-motion:no-preference){.pkr{animation:fr 1s linear infinite}.pkl{animation:fl 1.5s linear infinite}.led{animation:led 2.4s ease-in-out infinite}.blink{animation:blink 1.1s steps(1) infinite}.live{animation:live 1.6s ease-in-out infinite}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#232328"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.07 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="359" height="711" rx="14"/></clipPath><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" stroke="#A1A1AA" stroke-width="1.3" fill="